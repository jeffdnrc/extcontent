<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarasota County, Florida Weather</title>
  <style>
    :root {
      color-scheme: light;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1a1a1a;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 20px 0;
      color: #4b5563;
      font-size: 14px;
    }

    .temp {
      font-size: 40pt;
      font-weight: 700;
      margin: 8px 0;
    }

    .condition {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .metric {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
    }

    .metric-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #374151;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sarasota County, Florida</h1>
    <p class="subtitle">Current weather powered by Open-Meteo</p>

    <div id="weather">
      <div class="temp">Loading...</div>
      <div class="condition">Fetching current conditions</div>
    </div>

    <div class="grid" id="metrics" hidden>
      <div class="metric">
        <div class="metric-label">Feels Like</div>
        <div class="metric-value" id="apparentTemp">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">Wind</div>
        <div class="metric-value" id="wind">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">Humidity</div>
        <div class="metric-value" id="humidity">--</div>
      </div>
      <div class="metric">
        <div class="metric-label">Last Updated</div>
        <div class="metric-value" id="updated">--</div>
      </div>
    </div>

    <div class="status" id="status">Requesting live weather data...</div>
  </main>

  <script>
    const weatherCodes = {
      0: "Clear sky",
      1: "Mainly clear",
      2: "Partly cloudy",
      3: "Overcast",
      45: "Fog",
      48: "Depositing rime fog",
      51: "Light drizzle",
      53: "Moderate drizzle",
      55: "Dense drizzle",
      56: "Light freezing drizzle",
      57: "Dense freezing drizzle",
      61: "Slight rain",
      63: "Moderate rain",
      65: "Heavy rain",
      66: "Light freezing rain",
      67: "Heavy freezing rain",
      71: "Slight snow fall",
      73: "Moderate snow fall",
      75: "Heavy snow fall",
      77: "Snow grains",
      80: "Slight rain showers",
      81: "Moderate rain showers",
      82: "Violent rain showers",
      85: "Slight snow showers",
      86: "Heavy snow showers",
      95: "Thunderstorm",
      96: "Thunderstorm with slight hail",
      99: "Thunderstorm with heavy hail"
    };

    const sarasotaCountyLat = 27.1686;
    const sarasotaCountyLon = -82.5307;

    async function loadWeather() {
      const weatherEl = document.getElementById("weather");
      const statusEl = document.getElementById("status");
      const metricsEl = document.getElementById("metrics");

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${sarasotaCountyLat}&longitude=${sarasotaCountyLon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York`;

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const current = data.current;

        weatherEl.innerHTML = `
          <div class="temp">${Math.round(current.temperature_2m)}°F</div>
          <div class="condition">${weatherCodes[current.weather_code] || "Unknown conditions"}</div>
        `;

        document.getElementById("apparentTemp").textContent = `${Math.round(current.apparent_temperature)}°F`;
        document.getElementById("wind").textContent = `${Math.round(current.wind_speed_10m)} mph`;
        document.getElementById("humidity").textContent = `${current.relative_humidity_2m}%`;

        const updated = new Date(current.time);
        document.getElementById("updated").textContent =
          updated.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

        metricsEl.hidden = false;
        statusEl.textContent = "Live weather loaded successfully.";
      } catch (error) {
        weatherEl.innerHTML = `
          <div class="temp">Unavailable</div>
          <div class="condition">Could not load current weather</div>
        `;
        statusEl.textContent = `Error loading weather data: ${error.message}`;
        statusEl.classList.add("error");
      }
    }

    loadWeather();
  </script>
</body>
</html>
