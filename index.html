<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to March 9, 2031</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            color: #a0a0a0;
            font-weight: 300;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 2rem 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .time-unit:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .time-value {
            font-size: 5rem;
            font-weight: 700;
            color: #00d4ff;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .time-label {
            font-size: 1.2rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .target-date {
            font-size: 1.2rem;
            color: #666;
            margin-top: 2rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 2rem;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .time-unit {
                padding: 1.5rem 0.5rem;
            }

            .time-value {
                font-size: 3.5rem;
            }

            .time-label {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .time-value {
                font-size: 2.5rem;
            }

            .time-label {
                font-size: 0.9rem;
            }
        }

        .completed {
            font-size: 3rem;
            color: #00ff88;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Countdown Timer</h1>
        <p class="subtitle">Time Remaining Until March 9, 2031</p>
        
        <div id="countdown" class="countdown">
            <div class="time-unit">
                <div class="time-value" id="days">0</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="hours">0</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="minutes">0</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="seconds">0</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <p class="target-date">Target Date: March 9, 2031 at 12:00:00 AM</p>
    </div>

    <script>
        // Set the target date: March 9, 2031 at midnight
        const targetDate = new Date('2031-03-09T00:00:00').getTime();

        function updateCountdown() {
            // Get current time
            const now = new Date().getTime();
            
            // Calculate time difference
            const timeRemaining = targetDate - now;

            // Check if countdown is complete
            if (timeRemaining <= 0) {
                document.getElementById('countdown').innerHTML = 
                    '<div class="completed">Countdown Complete! 🎉</div>';
                return;
            }

            // Calculate time units
            const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

            // Update the display
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        // Update countdown immediately
        updateCountdown();

        // Update countdown every second
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
